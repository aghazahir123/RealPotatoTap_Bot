<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Potato Tap 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        .tap-btn:active { transform: scale(0.92); }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-70px); } }
        .floating-num { position: absolute; pointer-events: none; font-weight: 800; font-size: 1.5rem; color: #00F0FF; animation: floatUp 0.6s ease-out forwards; z-index: 50; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto relative overflow-hidden">
    
    <!-- Top Bar -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-cyan-500/20 border border-cyan-400 flex items-center justify-center font-bold text-cyan-400" id="user-avatar">
                🥔
            </div>
            <div>
                <h3 class="font-bold text-sm" id="user-name">Player</h3>
                <span class="text-xs text-yellow-400 font-semibold">Bronze Tapper</span>
            </div>
        </div>
        <button onclick="toggleAdmin()" class="px-3 py-1.5 rounded-xl bg-purple-600/30 border border-purple-500 text-purple-300 text-xs font-bold">
            Admin Panel
        </button>
    </div>

    <!-- Main Game View -->
    <div id="game-view" class="flex flex-col items-center justify-center my-auto space-y-6">
        <div class="text-center">
            <span class="text-xs uppercase text-slate-400 tracking-wider">Total Coins</span>
            <div class="text-4xl font-extrabold text-cyan-400 mt-1">
                ⚡ <span id="score">0</span>
            </div>
        </div>

        <!-- Tap Potato Button -->
        <button id="tap-btn" class="tap-btn relative w-56 h-56 rounded-full bg-gradient-to-tr from-purple-600 via-slate-800 to-cyan-500 p-2 shadow-2xl border-4 border-cyan-400/40 outline-none transition">
            <div class="w-full h-full rounded-full bg-slate-800 flex flex-col items-center justify-center border-2 border-slate-700 shadow-inner">
                <span class="text-7xl">🥔</span>
                <span class="mt-2 text-xs font-black text-cyan-400 tracking-widest uppercase">TAP TO EARN</span>
            </div>
        </button>

        <!-- Energy Bar -->
        <div class="w-full space-y-1">
            <div class="flex justify-between text-xs font-bold">
                <span class="text-yellow-400">⚡ <span id="energy-text">1000 / 1000</span></span>
                <span class="text-slate-400">+1 per sec</span>
            </div>
            <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden p-[2px] border border-slate-700">
                <div id="energy-bar" class="bg-gradient-to-r from-yellow-500 to-amber-300 h-full rounded-full transition-all duration-150" style="width: 100%"></div>
            </div>
        </div>
    </div>

    <!-- Admin View (Hidden by Default) -->
    <div id="admin-view" class="hidden my-auto space-y-4">
        <h2 class="text-xl font-bold text-cyan-400 border-b border-slate-800 pb-2">Admin Dashboard</h2>
        <div class="bg-slate-800 p-4 rounded-xl space-y-3 border border-slate-700">
            <div>
                <label class="text-xs text-slate-400">Coins Per Tap</label>
                <input type="number" id="adm-pertap" value="1" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs">
            </div>
            <div>
                <label class="text-xs text-slate-400">Add Bonus Coins to Balance</label>
                <input type="number" id="adm-addcoins" placeholder="e.g. 5000" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs">
            </div>
            <button onclick="saveAdmin()" class="w-full py-2 bg-cyan-500 text-slate-900 font-extrabold text-xs rounded-lg">SAVE CHANGES</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.expand(); tg.ready(); }

        let coins = 0;
        let energy = 1000;
        let maxEnergy = 1000;
        let perTap = 1;

        // Set User Info
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
        }

        const tapBtn = document.getElementById('tap-btn');

        function handleTap(e) {
            if (energy < perTap) return;
            
            energy -= perTap;
            coins += perTap;
            
            updateUI();

            // Floating +1 Animation
            let x = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : window.innerWidth / 2);
            let y = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : window.innerHeight / 2);
            
            let num = document.createElement('div');
            num.className = 'floating-num';
            num.innerText = '+' + perTap;
            num.style.left = (x - 10) + 'px';
            num.style.top = (y - 20) + 'px';
            document.body.appendChild(num);
            setTimeout(() => num.remove(), 600);
        }

        tapBtn.addEventListener('click', handleTap);

        function updateUI() {
            document.getElementById('score').innerText = coins;
            document.getElementById('energy-text').innerText = energy + ' / ' + maxEnergy;
            document.getElementById('energy-bar').style.width = ((energy / maxEnergy) * 100) + '%';
        }

        // Energy Regen
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 1);
                updateUI();
            }
        }, 1000);

        function toggleAdmin() {
            let g = document.getElementById('game-view');
            let a = document.getElementById('admin-view');
            g.classList.toggle('hidden');
            a.classList.toggle('hidden');
        }

        function saveAdmin() {
            let pt = parseInt(document.getElementById('adm-pertap').value);
            let ac = parseInt(document.getElementById('adm-addcoins').value);
            if (pt > 0) perTap = pt;
            if (ac > 0) coins += ac;
            updateUI();
            toggleAdmin();
        }
    </script>
</body>
</html>
