<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Potato Empire 🥔 Mini App</title>
  <!-- Telegram Web App SDK & React CDN -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #121212; color: #fff; text-align: center; height: 100vh; overflow: hidden; }
    #root { display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
    
    /* Top Header */
    .header { padding: 15px; background: #1e1e1e; border-bottom: 2px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .stat-box { background: #2a2a2a; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: bold; }
    .stat-val { color: #f4a261; margin-top: 3px; }

    /* Main View Area */
    .view-container { flex: 1; overflow-y: auto; padding: 15px; position: relative; }
    
    /* Tap Section (Hamster Style) */
    .potato-tap-area { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .potato-btn { width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, #e76f51, #e9c46a); border: 6px solid #f4a261; display: flex; align-items: center; justify-content: center; font-size: 80px; box-shadow: 0 0 30px rgba(244, 162, 97, 0.4); cursor: pointer; transition: transform 0.1s; }
    .potato-btn:active { transform: scale(0.92); }
    .energy-bar-box { width: 80%; background: #333; height: 12px; border-radius: 6px; margin-top: 20px; overflow: hidden; }
    .energy-fill { background: linear-gradient(90deg, #e76f51, #2a9d8f); height: 100%; width: 100%; transition: width 0.2s; }

    /* Navigation Bar */
    .nav-bar { display: flex; background: #1a1a1a; border-top: 1px solid #333; padding: 10px 0; }
    .nav-btn { flex: 1; background: none; border: none; color: #888; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .nav-btn.active { color: #f4a261; font-weight: bold; }

    /* Tomarket Mini Game Canvas */
    canvas { background: #1e1e1e; border-radius: 12px; width: 100%; height: 350px; border: 2px solid #444; }

    /* Cards & List Elements */
    .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .upgrade-card { background: #252525; border-radius: 10px; padding: 12px; text-align: left; border: 1px solid #3d3d3d; }
    .upgrade-card h4 { font-size: 14px; color: #f4a261; }
    .upgrade-card p { font-size: 11px; color: #aaa; margin: 4px 0; }
    .buy-btn { width: 100%; padding: 6px; background: #2a9d8f; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
    .buy-btn:disabled { background: #444; color: #888; }
    
    /* Admin Badge */
    .admin-badge { background: #e76f51; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const SUPER_ADMIN_ID = "7208905905";

    function App() {
      // User State
      const [userId, setUserId] = React.useState(SUPER_ADMIN_ID); // Defaulting for preview
      const [coins, setCoins] = React.useState(1500);
      const [pph, setPph] = React.useState(100); // Profit Per Hour
      const [energy, setEnergy] = React.useState(1000);
      const [activeTab, setActiveTab] = React.useState('tap');
      const [farmingTimeLeft, setFarmingTimeLeft] = React.useState(10800); // 3 Hours (Tomarket Harvest)
      
      // Admin Check
      const isOwner = userId === SUPER_ADMIN_ID;

      // Handle Telegram User Detection
      React.useEffect(() => {
        if (window.Telegram && window.Telegram.WebApp) {
          const tg = window.Telegram.WebApp;
          tg.ready();
          if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            setUserId(String(tg.initDataUnsafe.user.id));
          }
        }
      }, []);

      // Passive Profit Generator (Hamster PPH)
      React.useEffect(() => {
        const interval = setInterval(() => {
          setCoins(c => c + Math.floor(pph / 3600));
        }, 1000);
        return () => clearInterval(interval);
      }, [pph]);

      // Energy Auto-Recharge Engine
      React.useEffect(() => {
        const interval = setInterval(() => {
          setEnergy(e => Math.min(1000, e + 3));
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      // Main Tap Handler
      const handleTap = () => {
        if (energy >= 1) {
          setCoins(c => c + 1);
          setEnergy(e => e - 1);
        }
      };

      return (
        <div style={{height: '100%', display: 'flex', flexDirection: 'column'}}>
          {/* Header Stats */}
          <div className="header">
            <div className="stat-box">
              <span>$POTATO Coins</span>
              <div className="stat-val">🥔 {coins.toLocaleString()}</div>
            </div>
            <div className="stat-box">
              <span>Profit / Hour</span>
              <div className="stat-val">⚡ +{pph}/h</div>
            </div>
            <div className="stat-box">
              <span>Role</span>
              <div className="stat-val">
                {isOwner ? <span className="admin-badge">OWNER 👑</span> : "Player 🥔"}
              </div>
            </div>
          </div>

          {/* Main Content Body */}
          <div className="view-container">
            {activeTab === 'tap' && (
              <div className="potato-tap-area">
                <h3 style={{marginBottom: '15px', color: '#e9c46a'}}>Tap the Potato Boss!</h3>
                <div className="potato-btn" onClick={handleTap}>🥔</div>
                <div className="energy-bar-box">
                  <div className="energy-fill" style={{width: `${(energy / 1000) * 100}%`}}></div>
                </div>
                <p style={{fontSize: '12px', marginTop: '8px', color: '#aaa'}}>Energy: {energy} / 1000</p>
              </div>
            )}

            {activeTab === 'harvest' && (
              <div style={{padding: '20px'}}>
                <h2>🍅 Tomarket Hourly Farm</h2>
                <p style={{color: '#aaa', margin: '10px 0'}}>Harvest accumulated crops every 3 hours!</p>
                <div style={{fontSize: '40px', margin: '20px 0', color: '#f4a261'}}>⏱️ 02:59:45</div>
                <button className="buy-btn" style={{padding: '15px', fontSize: '16px'}}>🌾 Claim 3-Hour Harvest (+500 Coins)</button>
              </div>
            )}

            {activeTab === 'cards' && (
              <div>
                <h3>🐹 Upgrade Cards (Increase PPH)</h3>
                <div className="card-grid">
                  <div className="upgrade-card">
                    <h4>🥔 Potato Farm</h4>
                    <p>+50 PPH</p>
                    <button className="buy-btn" onClick={() => { setPph(p => p + 50); setCoins(c => c - 200); }}>Cost: 200 🥔</button>
                  </div>
                  <div className="upgrade-card">
                    <h4>🍟 French Fry Tech</h4>
                    <p>+150 PPH</p>
                    <button className="buy-btn" onClick={() => { setPph(p => p + 150); setCoins(c => c - 500); }}>Cost: 500 🥔</button>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'game' && <MiniGameEngine onScore={(s) => setCoins(c => c + s)} />}

            {activeTab === 'admin' && (
              <div>
                <h3>🛡️ Admin & Team Control</h3>
                {isOwner ? (
                  <div style={{textAlign: 'left', marginTop: '15px'}}>
                    <p style={{color: '#2a9d8f', fontWeight: 'bold'}}>Welcome Boss! (ID: {SUPER_ADMIN_ID})</p>
                    <hr style={{borderColor: '#333', margin: '10px 0'}} />
                    <label>Add Team Member ID:</label>
                    <input type="text" placeholder="e.g. 12345678" style={{width: '100%', padding: '8px', margin: '5px 0', background: '#333', border: '1px solid #555', color: 'white', borderRadius: '4px'}} />
                    <div style={{margin: '10px 0', fontSize: '12px'}}>
                      <input type="checkbox" id="task_perm" /> <label htmlFor="task_perm">Allow YouTube Tasks Management</label><br/>
                      <input type="checkbox" id="combo_perm" /> <label htmlFor="combo_perm">Allow Daily Combo Change</label>
                    </div>
                    <button className="buy-btn">Grant Limited Team Access</button>
                  </div>
                ) : (
                  <p style={{color: '#e76f51', marginTop: '20px'}}>Aap ke paas Full Admin Rights nahi hain. Faqat Master Admin control kar sakta hai!</p>
                )}
              </div>
            )}
          </div>

          {/* Bottom Navigation */}
          <div className="nav-bar">
            <button className={`nav-btn ${activeTab === 'tap' ? 'active' : ''}`} onClick={() => setActiveTab('tap')}>
              <span>🥔</span> Tap
            </button>
            <button className={`nav-btn ${activeTab === 'harvest' ? 'active' : ''}`} onClick={() => setActiveTab('harvest')}>
              <span>🍅</span> Harvest
            </button>
            <button className={`nav-btn ${activeTab === 'cards' ? 'active' : ''}`} onClick={() => setActiveTab('cards')}>
              <span>🐹</span> Mine
            </button>
            <button className={`nav-btn ${activeTab === 'game' ? 'active' : ''}`} onClick={() => setActiveTab('game')}>
              <span>🎯</span> Mini-Game
            </button>
            <button className={`nav-btn ${activeTab === 'admin' ? 'active' : ''}`} onClick={() => setActiveTab('admin')}>
              <span>🛡️</span> Team/Admin
            </button>
          </div>
        </div>
      );
    }

    // Canvas Engine for Slicing Mini Game
    function MiniGameEngine({ onScore }) {
      const canvasRef = React.useRef(null);
      const [isPlaying, setIsPlaying] = React.useState(false);
      const [gameScore, setGameScore] = React.useState(0);

      const startGame = () => {
        setIsPlaying(true);
        setGameScore(0);
        let items = [];
        let timer = 30;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');

        const spawn = setInterval(() => {
          items.push({
            x: Math.random() * (canvas.width - 30),
            y: 0,
            speed: 2 + Math.random() * 3,
            isBomb: Math.random() < 0.25
          });
        }, 500);

        const countdown = setInterval(() => {
          timer--;
          if (timer <= 0) {
            clearInterval(spawn);
            clearInterval(countdown);
            setIsPlaying(false);
          }
        }, 1000);

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.y += item.speed;
            ctx.beginPath();
            ctx.arc(item.x, item.y, 18, 0, Math.PI * 2);
            ctx.fillStyle = item.isBomb ? '#e76f51' : '#e9c46a';
            ctx.fill();
          }
          if (timer > 0) requestAnimationFrame(render);
        };
        render();
      };

      return (
        <div>
          <h3>🎯 Tomato-Style Slicing Game</h3>
          {!isPlaying ? (
            <button className="buy-btn" style={{padding: '12px', marginTop: '20px'}} onClick={startGame}>Start 30-Sec Game!</button>
          ) : (
            <div>
              <canvas ref={canvasRef} width={300} height={320}></canvas>
              <p style={{fontSize: '12px', color: '#aaa'}}>Tap Potatoes (Yellow), Avoid Bombs (Red)!</p>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
