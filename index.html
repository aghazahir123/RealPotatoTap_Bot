<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberTap Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="text-center space-y-4">
        <h1 class="text-3xl font-extrabold text-cyan-400">🥔 Potato Tap 3D</h1>
        <p class="text-sm text-gray-400">Tap to earn coins!</p>
        
        <button onclick="tap()" class="w-40 h-40 bg-gradient-to-tr from-purple-600 to-cyan-500 rounded-full text-6xl shadow-lg border-4 border-cyan-300 active:scale-95 transition flex items-center justify-center mx-auto">
            🥔
        </button>
        
        <div class="text-2xl font-bold text-yellow-400 mt-4">
            Coins: <span id="score">0</span>
        </div>
    </div>

    <script>
        let coins = 0;
        function tap() {
            coins++;
            document.getElementById('score').innerText = coins;
        }
    </script>
</body>
</html>
